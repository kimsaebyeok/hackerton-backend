spring:
  application:
    name: hackerton-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/advisor
    username: advisor
    password: advisor

  jackson:
    default-property-inclusion: non_null    # 클라이언트 계약은 camelCase → 기본 전략 유지

  jpa:
    hibernate:
      ddl-auto: validate      # DDL은 Flyway가 소유. Hibernate는 검증만
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # 마이그레이션 히스토리 테이블은 public 에 두고,
    # raw/mart 스키마는 V1 마이그레이션이 직접 생성한다.
    locations: classpath:db/migration

  # Java 21 가상 스레드 (ingest 배치 처리량용)
  threads:
    virtual:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

# ── 외부 LLM (어드바이징 질문/초안 생성용) ───────────────────
advisor:
  llm:
    provider: glm                     # glm(z.ai) — Anthropic 호환 엔드포인트
    base-url: https://api.z.ai/api/anthropic   # z.ai Anthropic 호환 엔드포인트 (/v1/messages)
    api-key: ${ADVISOR_LLM_API_KEY:}  # .env / 환경변수로 주입, 커밋 금지
    model: glm-5.1                    # 예: glm-5.1 | glm-4.6 | glm-4.5
    temperature: 0.2
    timeout-ms: 30000
